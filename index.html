<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Calculate monthly take-home pay with overtime and Cambodia income tax.">
  <meta name="theme-color" content="#102421">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Payroll">
  <title>Payroll</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere__wash"></div>
    <div class="atmosphere__orb atmosphere__orb--a"></div>
    <div class="atmosphere__orb atmosphere__orb--b"></div>
  </div>

  <div class="app">
    <header class="header">
      <h1 class="brand">Payroll</h1>
      <button id="install-app" class="install-button" type="button" hidden>
        Install
      </button>
    </header>

    <main class="panel">
      <form id="payroll-form" class="inputs" novalidate aria-label="Salary inputs">
        <div class="field">
          <label for="base-salary">Base salary</label>
          <div class="input-shell">
            <span class="input-prefix" aria-hidden="true">$</span>
            <input type="number" id="base-salary" name="baseSalary" min="0" step="0.01" placeholder="0.00" required
              inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" autocomplete="off"
              aria-describedby="base-salary-error">
          </div>
          <p id="base-salary-error" class="error-message" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="ot-hours">OT hours</label>
          <div class="input-shell">
            <input type="number" id="ot-hours" name="otHours" min="0" step="0.01" placeholder="0"
              inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" autocomplete="off"
              aria-describedby="ot-hours-error">
          </div>
          <p id="ot-hours-error" class="error-message" role="alert" hidden></p>
        </div>
      </form>

      <section class="summary" aria-labelledby="take-home-label" aria-live="polite">
        <div class="take-home">
          <span id="take-home-label" class="take-home__label">Take home</span>
          <span id="result-take-home" class="take-home__value">—</span>
        </div>

        <dl class="breakdown">
          <div class="breakdown__row">
            <dt>Base</dt>
            <dd id="result-base-salary">—</dd>
          </div>
          <div class="breakdown__row">
            <dt>Daily</dt>
            <dd id="result-daily-rate">—</dd>
          </div>
          <div class="breakdown__row">
            <dt>Hourly</dt>
            <dd id="result-hourly-rate">—</dd>
          </div>
          <div class="breakdown__row">
            <dt>OT pay</dt>
            <dd id="result-ot-pay">—</dd>
          </div>
          <div class="breakdown__row breakdown__row--total">
            <dt>Gross</dt>
            <dd id="result-earnings-before-tax">—</dd>
          </div>
          <div class="breakdown__row breakdown__row--deduction">
            <dt>Pension</dt>
            <dd id="result-pension">—</dd>
          </div>
          <div class="breakdown__row breakdown__row--deduction">
            <dt>Tax</dt>
            <dd id="result-income-tax">—</dd>
          </div>
        </dl>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>

</html>
